# Ambiente local do Solar: Postgres + API (.NET) + agente da Lia (Python).
#
# Rodar daqui:   docker compose up --build
#
# O agente e descrito pelo proprio repositorio dele, clonado ao lado deste
# (../solar-ai). Incluir o fragmento, em vez de subir dois composes, coloca os
# tres servicos na mesma rede: a API chama o agente por http://agente:8000.

name: solar

include:
  - ../solar-ai/compose.yml

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env do solar-ai-api}
    ports:
      # Exposto no host para dar para abrir com DBeaver/pgAdmin durante o dev.
      - "5432:5432"
    volumes:
      # Volume nomeado: os dados sobrevivem a docker compose down.
      # Para zerar o banco de verdade: docker compose down -v
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # pg_isready ja vem na imagem. E o que permite a API esperar o banco
      # estar ACEITANDO CONEXAO, e nao apenas o container ter iniciado --
      # a diferenca entre os dois e de varios segundos no primeiro boot.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      # Relativo a ESTE arquivo, mesmo quando incluido de outro repo.
      context: .
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      # Host=postgres: dentro da rede do compose, o nome do servico e o DNS.
      # "localhost" aqui apontaria para o proprio container da API.
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      Agente__BaseUrl: "http://agente:8000"
      # Chave das operacoes de privacidade (exclusao LGPD e painel do corretor).
      # Obrigatoria e sem valor padrao, de proposito: sem ela a API sobe e
      # responde /health, mas devolve 503 no painel e na exclusao -- falha
      # silenciosa que ja aconteceu uma vez, porque o .env tinha a chave e o
      # compose nao a repassava.
      SEGURANCA__CHAVEPRIVACIDADE: ${SEGURANCA__CHAVEPRIVACIDADE:?defina SEGURANCA__CHAVEPRIVACIDADE no .env do solar-ai-api}
      # Senha do supervisor semeado (supervisor.vinculado@solar.local), aplicada
      # so no primeiro boot. Vazia = ninguem entra no painel.
      Semente__SenhaSupervisor: ${SEMENTE__SENHASUPERVISOR:-}
      Metricas__JanelaRespostaFollowUpDias: ${METRICAS__JANELARESPOSTAFOLLOWUPDIAS:-7}
      SOLAR_VERSION: ${SOLAR_VERSION:-dev}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
